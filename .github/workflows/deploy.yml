name: Deploy to GitHub Pages

on:
    push:
        branches: [main] # Cambiá a 'master' si usás esa rama
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v4

            - name: Install, build, and upload your site
              uses: withastro/action@v3
              with:
                  node-version: 22 # Esto fuerza a usar Node 22 y evita el crash de Astro
                  package-manager: npm # Descomentá si usás pnpm o yarn

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
